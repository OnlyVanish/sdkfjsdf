<script>

/* =====================================================================

   ===================================================================== */

// ---------- core setup ----------
const WB = 320, WMAX = 432, H = 180, FLOOR = 160; // the world is 180 px tall; its width follows the screen (320 at 16:9, up to 432)
let W = WB;
const SIGN_FONT = "VazirSign, Vazirmatn, Vazir, Tahoma, sans-serif"; // crisp enough for tiny pixel signs
const FONT = "PlasmaDots, Vazirmatn, Vazir, 'Noto Naskh Arabic', 'Noto Sans Arabic', Tahoma, 'Segoe UI', 'Geeza Pro', Arial, sans-serif";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const [low, sctx] = mk(WMAX, H);       // low-res scene buffer (only the first W columns are shown)
const [lightC, lctx] = mk(WMAX, H);    // light map (multiplied over scene)
const [miniC, mictx] = mk(WB, H);      // close-ups are drawn 320 wide, then centred

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

const FA_DIG = '۰۱۲۳۴۵۶۷۸۹';
const toFa = s => String(s).replace(/\d/g, d => FA_DIG[d]);
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function shade(hex, k) { // multiply a #rrggbb color by k
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * k | 0, 0, 255), g = clamp(((n >> 8) & 255) * k | 0, 0, 255), b = clamp((n & 255) * k | 0, 0, 255);
  return `rgb(${r},${g},${b})`;

// ---------- audio (procedural, Web Audio) ----------
const A = { ctx: null, master: null, muted: false };
function audioOK() { return A.ctx && !A.muted && A.ctx.state === 'running'; }
function initAudio() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ac = new AC(); A.ctx = ac;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4;
  A.master = ac.createGain(); A.master.gain.value = 0.85;
  A.master.connect(comp); comp.connect(ac.destination);

  // shared white-noise buffer
  const len = ac.sampleRate * 2, nb = ac.createBuffer(1, len, ac.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  // echo bus (feedback delay) for stings & chimes
  A.fx = ac.createGain();
  const dl = ac.createDelay(1); dl.delayTime.value = 0.31;
  const fb = ac.createGain(); fb.gain.value = 0.38;
  const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2000;
  A.fx.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(A.master); A.fx.connect(A.master);

  // low synth drone: detuned saws + sub through a resonant, slowly breathing lowpass
  const droneG = ac.createGain(); droneG.gain.value = 0; droneG.connect(A.master);
  droneG.gain.setTargetAtTime(0.15, ac.currentTime, 2.5);
  const df = ac.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 210; df.Q.value = 7; df.connect(droneG);
  [[55, 'sawtooth', 0.45], [55.35, 'sawtooth', 0.45], [27.5, 'sine', 0.9], [82.4, 'triangle', 0.1]].forEach(([fr, t, g]) => {
    const o = ac.createOscillator(); o.type = t; o.frequency.value = fr;
    const gg = ac.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(df); o.start();
  });
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.06;
  const lg = ac.createGain(); lg.gain.value = 110; lfo.connect(lg); lg.connect(df.frequency); lfo.start();

  // ghostly pad: A minor with a major seventh, swelling in and out
  const padG = ac.createGain(); padG.gain.value = 0.012; padG.connect(A.master); padG.connect(A.fx);
  const padLfo = ac.createOscillator(); padLfo.frequency.value = 0.033;
  const padLg = ac.createGain(); padLg.gain.value = 0.012; padLfo.connect(padLg); padLg.connect(padG.gain); padLfo.start();
  const pf = ac.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 700; pf.connect(padG);
  [110, 130.8, 164.8, 207.65].forEach((fr, i) => {
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = fr; o.detune.value = (i - 1.5) * 4;
    const g = ac.createGain(); g.gain.value = 0.25; o.connect(g); g.connect(pf); o.start();
  });

  // wind: looping noise through a wandering band-pass
  const wn = ac.createBufferSource(); wn.buffer = nb; wn.loop = true;
  A.windF = ac.createBiquadFilter(); A.windF.type = 'bandpass'; A.windF.frequency.value = 450; A.windF.Q.value = 0.7;
  A.windG = ac.createGain(); A.windG.gain.value = 0;
  wn.connect(A.windF); A.windF.connect(A.windG); A.windG.connect(A.master); wn.start();

  // neon transformer hum (street scene)
  const ho = ac.createOscillator(); ho.type = 'sawtooth'; ho.frequency.value = 100;
  const hf = ac.createBiquadFilter(); hf.type = 'bandpass'; hf.frequency.value = 320; hf.Q.value = 3;
  A.humG = ac.createGain(); A.humG.gain.value = 0;

}
function noiseHit(t, dur, type, freq, q, gain, dest) {
  const ac = A.ctx, s = ac.createBufferSource(); s.buffer = A.noise;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;

}
function tone(t, freq, dur, type, gain, dest, slide) {
  const ac = A.ctx, o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.01, dur * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || A.master); o.start(t); o.stop(t + dur + 0.05);
}
let lastClick = 0;
const sfx = {
  step() { // crunchy footstep in snow: filtered noise grains + a soft thump
    if (!audioOK()) return; const t = A.ctx.currentTime, v = 0.16 + Math.random() * 0.08;
    noiseHit(t, 0.09, 'bandpass', 1600 + Math.random() * 1200, 0.9, v);
    noiseHit(t + 0.015 + Math.random() * 0.01, 0.06, 'highpass', 3200, 0.6, v * 0.45);
    tone(t, 90 + Math.random() * 20, 0.08, 'sine', 0.1, null, 45);
  },
  click() { // typewriter key
    if (!audioOK()) return; const t = A.ctx.currentTime; if (t - lastClick < 0.035) return; lastClick = t;
    noiseHit(t, 0.02, 'highpass', 2600 + Math.random() * 1800, 0.7, 0.06);
    tone(t, 1100 + Math.random() * 500, 0.018, 'square', 0.01);
  },
  inspect() { if (!audioOK()) return; const t = A.ctx.currentTime; tone(t, 660, 0.25, 'triangle', 0.05, A.fx); tone(t + 0.06, 440, 0.35, 'sine', 0.045); },
  choose() { if (!audioOK()) return; const t = A.ctx.currentTime; tone(t, 520, 0.07, 'square', 0.025); tone(t + 0.05, 780, 0.09, 'square', 0.02); },
  clue() { // noir sting: Am(maj7) arpeggio into the echo
    if (!audioOK()) return; const t = A.ctx.currentTime;
    [220, 261.6, 329.6, 415.3].forEach((n, i) => tone(t + i * 0.11, n, 1.6 - i * 0.15, 'triangle', 0.06, A.fx));
    tone(t, 55, 2.2, 'sine', 0.14);
  },
  reveal() { if (!audioOK()) return; const t = A.ctx.currentTime; [1760, 2217, 2637, 3520].forEach((n, i) => tone(t + i * 0.05, n, 0.5, 'sine', 0.018, A.fx)); },
  whoosh() {
    if (!audioOK()) return; const ac = A.ctx, t = ac.currentTime, s = ac.createBufferSource(); s.buffer = A.noise;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.45); f.frequency.exponentialRampToValueAtTime(220, t + 1.0);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
    s.connect(f); f.connect(g); g.connect(A.master); s.start(t, 0, 1.1);
  },
  crackle(v) { if (!audioOK()) return; const t = A.ctx.currentTime; noiseHit(t, 0.015 + Math.random() * 0.03, 'bandpass', 1400 + Math.random() * 3000, 1.4, v); },
  toggle() { if (!audioOK()) return; const t = A.ctx.currentTime; noiseHit(t, 0.03, 'highpass', 1800, 0.8, 0.12); tone(t, 180, 0.04, 'square', 0.03); },
  ending(good) {
    if (!audioOK()) return; const t = A.ctx.currentTime;
    const ch = good ? [110, 164.8, 220, 277.2, 329.6] : [103.8, 155.6, 207.7, 246.9, 311.1];
    ch.forEach((n, i) => tone(t + i * 0.18, n, 4.5, 'triangle', 0.05, A.fx));
    tone(t, 41.2, 5, 'sine', 0.18);
  }
};
function audioUpdate(dt) {
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  const gust = 0.5 + 0.5 * Math.sin(G.t * 0.23) * Math.sin(G.t * 0.071 + 1.3);
  const indoor = G.sceneId === 'station' && G.state !== 'title';
  A.windG.gain.setTargetAtTime(A.muted ? 0 : indoor ? 0.006 : 0.03 + gust * 0.05, t, 0.3);
  A.windF.frequency.setTargetAtTime(320 + gust * 700, t, 0.4);

  A.humG.gain.setTargetAtTime(A.muted ? 0 : hum, t, 0.03);
  if (G.sceneId === 'alley' && G.state === 'play') { // fire crackles near the barrel
    const d = Math.abs(P.x - 76), v = clamp(1 - d / 160, 0, 1);

  }
  if (indoor && G.state === 'play' && !G.mini && audioOK()) { // radio static near dispatch, the wall clock ticking
    const v = clamp(1 - Math.abs(P.x - 390) / 200, 0, 1);
    if (v > 0 && Math.random() < dt * 6) noiseHit(t, 0.04 + Math.random() * 0.1, 'bandpass', 1200 + Math.random() * 1800, 1.5, 0.02 * v + 0.004);
    const sec = Math.floor(G.t), cvol = clamp(1 - Math.abs(P.x - 301) / 170, 0, 1);

// ---------- procedural pixel-art helpers ----------
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }

function makeKeypad(o) { return (() => {

function makeTuner(o) {

// --- mini-game: a safe dial (turn to each number, press «ثبت») ---
function makeSafe(o) {
  const S = { ang: 0, drag: null, ent: [], st: 'idle', stT: 0 }, CX = 150, CY = 92, RR = 58, N = 40;
  const num = () => ((Math.round(-S.ang / (6.2832 / N)) % N) + N) % N;
  const BTN = { l: [236, 60, 26, 20], r: [268, 60, 26, 20], ok: [236, 90, 58, 22] };
  const inB = (m, b) => m.x >= b[0] && m.x <= b[0] + b[2] && m.y >= b[1] && m.y <= b[1] + b[3];
  const tick = () => { if (audioOK()) noiseHit(A.ctx.currentTime, 0.02, 'highpass', 3000, 1, 0.06); };
  function commit() {
    S.ent.push(num()); sfx.beep(780);
    if (S.ent.length === 3) { if (S.ent.join('-') === o.code.join('-')) { S.st = 'ok'; S.stT = 0; sfx.okChime(); } else { S.st = 'err'; S.stT = 0; sfx.buzz(); } }
  }
  return {
    title: 'نمای نزدیک: گاوصندوقِ پشتِ تابلو',
    enter() { S.ent = []; S.st = has(o.clue) ? 'done' : 'idle'; },
    hint() { return S.st === 'done' || S.st === 'ok' ? 'گاوصندوق باز شد.' : 'قفل را بچرخان (یا ◄ ►) تا عدد زیرِ مثلثِ قرمز بیاید، بعد «ثبت». سه عدد.'; },
    down(m) {
      if (D.active || S.st === 'ok' || S.st === 'done') return;
      if (inB(m, BTN.l)) { S.ang += 6.2832 / N; tick(); return; }
      if (inB(m, BTN.r)) { S.ang -= 6.2832 / N; tick(); return; }
      if (inB(m, BTN.ok)) { commit(); return; }
      if (Math.hypot(m.x - CX, m.y - CY) < RR + 8) S.drag = { a0: Math.atan2(m.y - CY, m.x - CX), s0: S.ang, last: num() };
    },
    move(m) { if (!S.drag) return; S.ang = S.drag.s0 + angDiff(Math.atan2(m.y - CY, m.x - CX), S.drag.a0); const n = num(); if (n !== S.drag.last) { S.drag.last = n; tick(); } },
    up() { if (S.drag) { S.ang = -num() * 6.2832 / N; S.drag = null; } },
    update(dt) {
      S.stT += dt;
      if (S.st === 'err' && S.stT > 0.8) { S.st = 'idle'; S.ent = []; }
      if (S.st === 'ok' && S.stT > 1.0) { S.st = 'done'; closeMini(); startDialog(o.dialog); }
    },
    render(g) {
      R(g, 0, 0, WB, H, '#2a2622'); R(g, 70, 16, 180, 152, '#4a4a50'); R(g, 74, 20, 172, 144, '#5a5a62');
      g.fillStyle = '#2a2a30'; g.beginPath(); g.arc(CX, CY, RR + 4, 0, 6.28); g.fill(); g.fillStyle = '#c8c8d0'; g.beginPath(); g.arc(CX, CY, RR, 0, 6.28); g.fill();
      for (let i = 0; i < N; i++) { const a = S.ang + i * 6.2832 / N - Math.PI / 2, l = i % 5 ? 5 : 9; for (let k = 0; k < l; k++) R(g, Math.round(CX + Math.cos(a) * (RR - 2 - k)), Math.round(CY + Math.sin(a) * (RR - 2 - k)), 1, 1, '#2a2a30'); }
      g.fillStyle = '#8a8a92'; g.beginPath(); g.arc(CX, CY, 18, 0, 6.28); g.fill(); R(g, CX - 2, CY - 16, 4, 32, '#6a6a72');
      g.fillStyle = '#e03030'; g.beginPath(); g.moveTo(CX - 5, CY - RR - 10); g.lineTo(CX + 5, CY - RR - 10); g.lineTo(CX, CY - RR - 3); g.fill();
      for (const k of ['l', 'r', 'ok']) { const b = BTN[k]; R(g, b[0], b[1] + 2, b[2], b[3], '#1a1a1e'); R(g, b[0], b[1], b[2], b[3], k === 'ok' ? '#b8741e' : '#3a3a42'); }
      const m = lowMouse(); miniLight([80, 76, 72], [[m.x, m.y, 100, [255, 236, 200], 0.7], [150, 20, 200, [255, 220, 170], 0.45]]);
      const col = S.st === 'err' ? '#ff4040' : S.st === 'ok' || S.st === 'done' ? '#40ff70' : '#3a1010'; R(g, 238, 124, 6, 6, col);
    },
    ui(u, X, Y) {
      for (let i = 0; i < N; i += 5) { const a = S.ang + i * 6.2832 / N - Math.PI / 2; ltrText(toFa(i), X + (CX + Math.cos(a) * (RR - 16)) * u, Y + (CY + Math.sin(a) * (RR - 16)) * u, '#1a1a20', fnt(u * 3, 'bold')); }
      ltrText('◄', X + 249 * u, Y + 70.5 * u, '#f0e8d8', fnt(u * 4, 'bold')); ltrText('►', X + 281 * u, Y + 70.5 * u, '#f0e8d8', fnt(u * 4, 'bold'));
      rtl('ثبت', X + 265 * u, Y + 101.5 * u, '#1c1208', fnt(u * 3.6, 'bold'), 'center');
      ltrText(S.ent.map(toFa).join('  —  ') || '—', X + 265 * u, Y + 140 * u, '#ffe2b0', fnt(u * 4, 'bold'));
      ltrText(toFa(num()), X + CX * u, Y + (CY + 36) * u, '#ffd23a', fnt(u * 5, 'bold'));
    }
  };
}

function setMenu(m) { G.menu = m; G.menuT = 0; G.menuHelp = false; G.flip = null; }
function openBook() { setMenu('book'); sfx.paper(); }
function flipTo(n) {
  if (G.flip || n < 1 || n > LEVEL_COUNT() || n === G.titleSel) return;
  G.flip = { from: G.titleSel, to: n, t: 0 }; G.titleSel = n; sfx.paper();
}
const bookFs = () => clamp(UI.fs, 1.2, 1.35), bfnt = (px, w) => fnt(px * bookFs() / UI.fs, w); // notebook text never shrinks below 1.2
function menuStamp(text, x, y, col, rot, u) {
  const f = bfnt(u * 6, 'bold'); ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = 0.85; ctx.font = f;
  const w = ctx.measureText(text).width + 7 * u, h = 10 * u * bookFs(), lw = Math.max(2, Math.round(u * 0.9));
  ctx.fillStyle = col; ctx.fillRect(-w / 2, -h / 2, w, lw); ctx.fillRect(-w / 2, h / 2 - lw, w, lw); ctx.fillRect(-w / 2, -h / 2, lw, h); ctx.fillRect(w / 2 - lw, -h / 2, lw, h);
  rtl(text, 0, u * 0.4, col, f, 'center'); ctx.restore();
}
const CAST = {}, THUMB_X = {}, THUMBS = {};
function caseThumb(n) { // a small photo of the case's scene, the detective standing in it
  if (THUMBS[n]) return THUMBS[n];
  const S = SCENES[LEVELS[n].scene], w = 128, h = 72, sx = clamp((THUMB_X[n] || S.spawn) - w / 2, 0, S.w - w), sy = 164 - h, [c, g] = mk(w, h);
  if (S.indoor) R(g, 0, 0, w, h, '#0a0a0e'); else g.drawImage(S.skyGrad || SKY.grad, 0, sy, WB, h, 0, 0, w, h);
  g.drawImage(S.bg, sx, sy, w, h, 0, 0, w, h);
  drawDetective(g, w / 2 - 10, FLOOR - sy, 1, 0, false, 0.15);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = S.indoor ? '#8c7c92' : '#8a88aa'; g.fillRect(0, 0, w, h);
  const vg = g.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, w * 0.62); vg.addColorStop(0, 'rgba(255,255,255,1)'); vg.addColorStop(1, 'rgba(60,50,70,1)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h); g.globalCompositeOperation = 'source-over';
  g.drawImage(S.em, sx, sy, w, h, 0, 0, w, h);
  return (THUMBS[n] = c);
}
function paperPage(r, u) {
  panel(r.x, r.y, r.w, r.h, '#e9ddc2');
  const t = Math.max(1, Math.round(u * 0.5));
  ctx.fillStyle = 'rgba(70,100,150,0.2)'; for (let y = r.y + 12 * u; y < r.y + r.h - 4 * u; y += 7 * u * bookFs()) ctx.fillRect(r.x + 3 * u, Math.round(y), r.w - 6 * u, t);
  ctx.fillStyle = 'rgba(190,50,50,0.35)'; ctx.fillRect(r.x + r.w - 8 * u, r.y + 2 * u, t, r.h - 4 * u);
}
function pageRight(n, r, u) { // the case: number, name, a taped photo, the verdict stamp

  ctx.fillStyle = 'rgba(40,24,10,0.25)'; ctx.fillRect(px - u, py - u, pw + 5 * u, ph + 11 * u);
  ctx.fillStyle = '#f6f1e6'; ctx.fillRect(px - 2 * u, py - 2 * u, pw + 4 * u, ph + 10 * u);

  ctx.fillStyle = 'rgba(232,222,168,0.8)'; ctx.fillRect(px - 5 * u, py - 4 * u, 12 * u, 4 * u); ctx.fillRect(px + pw - 7 * u, py - 4 * u, 12 * u, 4 * u);

function pageLeft(n, r, u) { // the detective's notes and the big start button
